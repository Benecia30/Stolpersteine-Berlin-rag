<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Stolpersteine RAG architecture</title>
<desc>A user question is sent to hybrid retrieval, which runs BM25 keyword search and FAISS semantic search in parallel, fuses them with RRF, sends the top matches to an LLM for grounded generation, produces an answer with a citation check, and displays it in the Streamlit app.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<path d="M340,84 L340,94 L230,94 L230,104" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M340,84 L340,94 L450,94 L450,104" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M230,160 L230,190 L340,190 L340,214" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M450,160 L450,190 L340,190 L340,214" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="270" x2="340" y2="308" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="364" x2="340" y2="402" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="458" x2="340" y2="496" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="40" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">User question</text>
</g>

<g>
<rect x="130" y="104" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="230" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">BM25</text>
<text x="230" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Keyword search</text>
</g>

<g>
<rect x="350" y="104" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="450" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">FAISS</text>
<text x="450" y="142" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Semantic search</text>
</g>

<g>
<rect x="240" y="214" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="232" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">RRF fusion</text>
<text x="340" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">Merges the two rankings</text>
</g>

<g>
<rect x="230" y="308" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">LLM generation</text>
<text x="340" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Groq, llama-3.3-70b</text>
</g>

<g>
<rect x="230" y="402" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="420" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Answer + citations</text>
<text x="340" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">Checked against sources</text>
</g>

<g>
<rect x="240" y="496" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="518" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Streamlit app</text>
</g>
</svg>
